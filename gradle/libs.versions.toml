[versions]
agp = "9.1.0"
# Kotlin language/compiler version. The Compose compiler plugin version MUST
# track this: keeping both behind one ref means an AGP bump that changes the
# bundled Kotlin can't silently desync the Compose plugin.
kotlin = "2.1.21"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
langchain4j = "1.12.2"
okhttp = "4.12.0"
gson = "2.13.2"
constraintlayout = "2.1.4"
utilcode = "1.31.1"
lifecycle = "2.8.7"
mmkv = "2.3.0"
easyfloat = "2.0.4"
zxing = "3.5.3"
nanohttpd = "2.3.1"
jsch = "0.2.18"
carApp = "1.4.0"
composeBom = "2025.05.00"
activityCompose = "1.9.3"
androidxMedia = "1.7.0"
litertlm = "0.16.1"
mlkitTextRecognition = "16.0.1"
zstdJni = "1.5.7-11"
xz = "1.12"
shizuku = "13.1.5"
bouncycastle = "1.81"
libadb = "3.1.1"
sunSecurityAndroid = "1.1"
conscrypt = "2.5.3"
vosk = "0.3.47"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
langchain4j-core = { group = "dev.langchain4j", name = "langchain4j-core", version.ref = "langchain4j" }
langchain4j-openai = { group = "dev.langchain4j", name = "langchain4j-open-ai", version.ref = "langchain4j" }
langchain4j-anthropic = { group = "dev.langchain4j", name = "langchain4j-anthropic", version.ref = "langchain4j" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
utilcode = { group = "com.blankj", name = "utilcodex", version.ref = "utilcode" }
lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
mmkv = { module = "com.tencent:mmkv-static", version.ref = "mmkv" }
easyfloat = { module = "com.github.princekin-f:EasyFloat", version.ref = "easyfloat" }
zxing = { module = "com.google.zxing:core", version.ref = "zxing" }
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
jsch = { module = "com.github.mwiede:jsch", version.ref = "jsch" }
car-app = { module = "androidx.car.app:app", version.ref = "carApp" }
car-app-projected = { module = "androidx.car.app:app-projected", version.ref = "carApp" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-media = { group = "androidx.media", name = "media", version.ref = "androidxMedia" }
litertlm = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlm" }
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitTextRecognition" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstdJni" }
xz = { module = "org.tukaani:xz", version.ref = "xz" }
shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }
bcpkix = { module = "org.bouncycastle:bcpkix-jdk15to18", version.ref = "bouncycastle" }
libadb-android = { module = "com.github.MuntashirAkon:libadb-android", version.ref = "libadb" }
sun-security-android = { module = "com.github.MuntashirAkon:sun-security-android", version.ref = "sunSecurityAndroid" }
conscrypt-android = { module = "org.conscrypt:conscrypt-android", version.ref = "conscrypt" }
vosk-android = { module = "com.alphacephei:vosk-android", version.ref = "vosk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
